name: Build macOS app

on: [push, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that tkinter is available
        run: python -c "import tkinter; print('Tk version', tkinter.TkVersion)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build app with PyInstaller
        run: pyinstaller --noconfirm --windowed --name BinancePumpAlerts --osx-bundle-identifier com.example.binancepumpalerts run.py

      - name: Ad-hoc code signing
        run: codesign --force --deep --sign - dist/BinancePumpAlerts.app

      - name: Create DMG
        run: |
          mkdir dmg_src
          cp -R dist/BinancePumpAlerts.app dmg_src/
          ln -s /Applications dmg_src/Applications
          hdiutil create -volname "Binance Pump Alerts" -srcfolder dmg_src -ov -format UDZO "BinancePumpAlerts-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: BinancePumpAlerts-mac-${{ matrix.arch }}
          path: BinancePumpAlerts-${{ matrix.arch }}.dmg
